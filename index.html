<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applied AI Guide: Bacolod City, November 24 to 26, 2026</title>
    <meta
      name="description"
      content="Participant guide for Applied AI for Automation and Decision Support, a three-day government workforce training in Bacolod City, November 24 to 26, 2026."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
    />
    <script>
      (function () {
        var theme;
        try {
          theme = window.localStorage.getItem("aag:theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add("js");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; max-width: 40rem">
        This guide needs JavaScript to show its pages, checklists and worksheets. Please turn it on, or ask your trainer for the printed
        Participant Guide.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
